services:
  media-resolver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8100:8000"
    env_file:
      - "${ISEC_ENV_FILE:?这份配置由 isec 提供，请用 isec docker compose ... 启动}"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
