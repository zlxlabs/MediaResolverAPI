# D3 自动部署：push master 自动 build→ACR→SSH 部署→探针→失败自动回滚。
# 设计与接入记录：docs/sessions/261014-d3-release/design.md
# 手工脚本 docker/push_to_acr.sh 仅 break-glass 应急，与本流水线互斥使用。
name: deploy
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  ship:
    uses: zlxlabs/ci-templates/.github/workflows/build-deploy.yml@v2
    with:
      image_name: media-resolver-api
      host: 100.107.95.24
      ssh_user: lixing
      # 本仓 public：服务器绝对路径不进 git，经 secrets 注入（值 = secrets D3_DEPLOY_DIR）。
      deploy_dir: ${{ secrets.D3_DEPLOY_DIR }}
      healthcheck_url: http://localhost:8206/health
      healthcheck_warmup: 10
      healthcheck_retries: 12
      healthcheck_interval: 5
      ci_templates_ref: v2
      notify_on_success: true
    secrets:                                         # 逐个显式传，最小权限(禁止 secrets: inherit)
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      # runner=self 时 Tailscale step 整步跳过(build-deploy.yml L218-229 if runner=='hosted')，
      # 占位值运行时不触达；未来切 hosted 必须先换真值。
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      # ci-templates 已 public，checkout 用默认 token(L162-167 注释)，此 PAT 不再消费，
      # 契约兼容保留；上游 v2 摘除后可删。
      CI_TEMPLATES_PAT: ${{ secrets.CI_TEMPLATES_PAT }}
      FEISHU_CI_WEBHOOK: ${{ secrets.FEISHU_CI_WEBHOOK }}
